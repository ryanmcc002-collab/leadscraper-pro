<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Office Pod floor plan" font-family="Manrope, Arial, sans-serif">
  <rect width="1000" height="560" fill="#FFFFFF"/>
  <text x="90" y="60" font-size="26" font-weight="800" fill="#0D233F">Floor Plan</text>
  <text x="90" y="88" font-size="17" fill="#5B6B7E">Expanded 3.6m × 2.4m (fixed module) &#183; 8.6m&#178; internal &#183; transports at 3.6m × 2.4m</text>
  <rect x="80" y="110" width="840" height="340" rx="12" fill="#0D233F"/>
  <g>
      <rect x="93" y="123" width="568" height="314" rx="6" fill="#F7F8FA" stroke="#C6D0DC" stroke-width="2"/>
      <text x="377" y="280" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="700" fill="#0D233F">Workspace</text>
    </g>
  <g>
      <rect x="667" y="123" width="240" height="314" rx="6" fill="#F7F8FA" stroke="#C6D0DC" stroke-width="2"/>
      <text x="787" y="280" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="700" fill="#0D233F">Storage Wall</text>
    </g>
  <g stroke="#D6AF5E" stroke-width="2.5" stroke-dasharray="8 6" fill="none">
    <rect x="237.6" y="94" width="524.8" height="372" rx="10"/>
  </g>
  <text x="500" y="502" text-anchor="middle" font-size="16" font-weight="700" fill="#C29A45">— — transport core (wings fold in for delivery) — —</text>
  <g font-size="15" fill="#5B6B7E">
    <text x="910" y="60" text-anchor="end" font-weight="700">Indicative layout</text>
    <text x="910" y="82" text-anchor="end">Final dimensions confirmed on order</text>
  </g>
</svg>
